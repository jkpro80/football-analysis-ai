events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Protect admin login against brute-force attempts.
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

    upstream backend_service {
        server backend:8000;
    }

    upstream frontend_service {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name xn--mlx-ula.com www.xn--mlx-ula.com;

        return 301 https://xn--mlx-ula.com$request_uri;
    }

    server {
        listen 443 ssl;
        server_name xn--mlx-ula.com www.xn--mlx-ula.com;

        ssl_certificate /etc/letsencrypt/live/xn--mlx-ula.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/xn--mlx-ula.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = /api/admin/login {
            limit_req zone=admin_login burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://frontend_service;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
        }

        location /api/admin/ {
            proxy_pass http://frontend_service;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
        }

        location /api/ {
            proxy_pass http://backend_service/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
        }

        location = /openapi.json {
            return 404;
        }

        location = /docs {
            return 404;
        }

        location = /redoc {
            return 404;
        }

        location = /api/openapi.json {
            return 404;
        }

        location = /api/docs {
            return 404;
        }

        location = /api/redoc {
            return 404;
        }

        location / {
            proxy_pass http://frontend_service;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
